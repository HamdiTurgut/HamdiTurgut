<svg width="680" height="290" viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg">
  <style>
    .pr { font-family: 'Courier New', monospace; font-size: 13px; fill: #3fb950; }
    .cm { font-family: 'Courier New', monospace; font-size: 13px; fill: #e6edf3; }
    .ky { font-family: 'Courier New', monospace; font-size: 13px; fill: #79c0ff; }
    .eq { font-family: 'Courier New', monospace; font-size: 13px; fill: #484f58; }
    .st { font-family: 'Courier New', monospace; font-size: 13px; fill: #a8daab; }
    .it { font-family: 'Courier New', monospace; font-size: 13px; fill: #e6edf3; font-style: italic; }
    .bl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
  </style>

  <rect width="680" height="290" rx="10" fill="#0d1117"/>
  <rect width="680" height="290" rx="10" fill="none" stroke="#21262d" stroke-width="1"/>
  <circle cx="28" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="48" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="68" cy="24" r="5.5" fill="#28c840"/>
  <line x1="0" y1="38" x2="680" y2="38" stroke="#21262d" stroke-width="1"/>

  <!-- CMD 1 -->
  <text x="20" y="62" class="pr">hamdi@dev ~$</text>
  <clipPath id="cp1">
    <rect x="138" y="48" height="20" width="0">
      <animate attributeName="width" from="0" to="160" dur="0.8s" begin="0.2s" fill="freeze"/>
    </rect>
  </clipPath>
  <text x="138" y="62" class="cm" clip-path="url(#cp1)"> cat identity.conf</text>
  <rect x="138" y="50" width="8" height="12" fill="#3fb950">
    <animate attributeName="x" from="138" to="298" dur="0.8s" begin="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.05s" begin="1.1s" fill="freeze"/>
  </rect>

  <!-- OUTPUT 1 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.15s" fill="freeze"/>
    <text x="20" y="79"><tspan class="ky">name    </tspan><tspan class="eq"> = </tspan><tspan class="st">Hamdi Turgut</tspan></text>
    <text x="20" y="95"><tspan class="ky">role    </tspan><tspan class="eq"> = </tspan><tspan class="st">Software Developer</tspan></text>
    <text x="20" y="111"><tspan class="ky">location</tspan><tspan class="eq"> = </tspan><tspan class="st">Turkey, TR</tspan></text>
  </g>

  <!-- CMD 2 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="1.2s" fill="freeze"/>
    <text x="20" y="144" class="pr">hamdi@dev ~$</text>
  </g>
  <clipPath id="cp2">
    <rect x="138" y="130" height="20" width="0">
      <animate attributeName="width" from="0" to="110" dur="0.6s" begin="1.3s" fill="freeze"/>
    </rect>
  </clipPath>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="1.25s" fill="freeze"/>
    <text x="138" y="144" class="cm" clip-path="url(#cp2)"> echo $MOTTO</text>
    <rect x="138" y="132" width="8" height="12" fill="#3fb950">
      <animate attributeName="x" from="138" to="248" dur="0.6s" begin="1.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0" dur="0.05s" begin="2.0s" fill="freeze"/>
    </rect>
  </g>

  <!-- OUTPUT 2 -->
  <text x="20" y="161" class="it" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.05s" fill="freeze"/>
    build fast. ship clean. automate everything else.
  </text>

  <!-- IDLE -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.1s" fill="freeze"/>
    <text x="20" y="190" class="pr">hamdi@dev ~$</text>
    <rect x="138" y="178" width="8" height="12" fill="#3fb950">
      <animate attributeName="opacity" values="0;1;1;0;0" dur="1s" begin="2.15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- DIVIDER -->
  <line x1="20" y1="208" x2="660" y2="208" stroke="#21262d" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.2s" fill="freeze"/>
  </line>

  <!-- BADGES -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.35s" fill="freeze"/>

    <!-- C++ badge: x=258, width=82 -->
    <rect x="258" y="222" width="82" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- blue left panel -->
    <rect x="258" y="222" width="32" height="30" rx="6" fill="#00599c"/>
    <rect x="274" y="222" width="16" height="30" fill="#00599c"/>
    <!-- C++ logo as path, scaled to 18x18, centered in 32px panel at x=258+7=265, y=222+6=228 -->
    <g transform="translate(265,228) scale(0.75)">
      <!-- C++ official logo path (simplified) -->
      <path d="M16 0C7.163 0 0 7.163 0 16s7.163 16 16 16 16-7.163 16-16S24.837 0 16 0z" fill="#00599c"/>
      <path d="M16 4C9.373 4 4 9.373 4 16s5.373 12 12 12 12-5.373 12-12S22.627 4 16 4z" fill="#004482"/>
      <path d="M10.5 20.5C9.1 19.3 8.2 17.5 8.2 16c0-1.5.9-3.3 2.3-4.5l1.4 1.6C10.9 14 10.2 15 10.2 16s.7 2 1.7 2.9l-1.4 1.6zm5.5 1.5c-1.1 0-2.2-.3-3.1-.8l1-1.8c.6.3 1.3.5 2.1.5 2.8 0 5-2.2 5-5s-2.2-5-5-5c-.8 0-1.5.2-2.1.5l-1-1.8c.9-.5 2-.8 3.1-.8 3.9 0 7 3.1 7 7s-3.1 7-7 7zm4-6h-1.5v1.5h-1V16h-1.5v-1H19v-1.5h1V15h1.5v1zm4 0h-1.5v1.5h-1V16h-1.5v-1H23v-1.5h1V15h1.5v1z" fill="white"/>
    </g>
    <text x="308" y="241" class="bl" text-anchor="middle">C++</text>

    <!-- Linux badge: x=352, width=86 -->
    <rect x="352" y="222" width="86" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- yellow left panel -->
    <rect x="352" y="222" width="32" height="30" rx="6" fill="#FCC624"/>
    <rect x="368" y="222" width="16" height="30" fill="#FCC624"/>
    <!-- Tux penguin simplified SVG, 18x18, at translate(359,225) -->
    <g transform="translate(359,225)">
      <!-- body -->
      <ellipse cx="7" cy="13" rx="5" ry="6" fill="#1a1a1a"/>
      <!-- belly -->
      <ellipse cx="7" cy="14" rx="3.2" ry="4.5" fill="white"/>
      <!-- head -->
      <ellipse cx="7" cy="6" rx="5.5" ry="5.5" fill="#1a1a1a"/>
      <!-- face white patch -->
      <ellipse cx="7" cy="7" rx="3.5" ry="3.5" fill="#f5c518"/>
      <!-- eyes -->
      <circle cx="5.2" cy="5.5" r="1.1" fill="white"/>
      <circle cx="8.8" cy="5.5" r="1.1" fill="white"/>
      <circle cx="5.4" cy="5.5" r="0.5" fill="#1a1a1a"/>
      <circle cx="9" cy="5.5" r="0.5" fill="#1a1a1a"/>
      <!-- beak -->
      <ellipse cx="7" cy="8.5" rx="1.8" ry="1" fill="#e8a000"/>
      <!-- feet -->
      <ellipse cx="4.5" cy="19.5" rx="2.5" ry="1" fill="#e8a000"/>
      <ellipse cx="9.5" cy="19.5" rx="2.5" ry="1" fill="#e8a000"/>
    </g>
    <text x="406" y="241" class="bl" text-anchor="middle">Linux</text>
  </g>
</svg>
